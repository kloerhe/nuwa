name: macOS Build Smoke Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      # ------------------------------------------------------------
      # 1. macOS environment
      # ------------------------------------------------------------
      - name: Show macOS environment
        run: |
          sw_vers
          uname -a
          uname -m

      # ------------------------------------------------------------
      # 2. Install host dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          brew install python cmake ninja

      # ------------------------------------------------------------
      # 3. Python virtual environment
      # ------------------------------------------------------------
      - name: Setup Python
        run: |
          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install west

          echo "=== Python ==="
          which python
          python --version

          echo "=== West ==="
          which west
          west --version

      # ------------------------------------------------------------
      # 4. Initialize official Nuwa workspace
      # ------------------------------------------------------------
      - name: Initialize Nuwa workspace
        run: |
          source .venv/bin/activate

          west init \
            -m https://github.com/Ameba-AIoT/nuwa.git

          west update

      # ------------------------------------------------------------
      # 5. Inspect West workspace
      # ------------------------------------------------------------
      - name: Inspect workspace
        run: |
          source .venv/bin/activate

          echo "=== west topdir ==="
          west topdir

          echo "=== current directory ==="
          pwd

          echo "=== west list ==="
          west list

          echo "=== workspace directories ==="
          find "$(west topdir)" -maxdepth 2 -type d | sort

      # ------------------------------------------------------------
      # 6. Test Nuwa meta tool
      # ------------------------------------------------------------
      - name: Test Nuwa meta tool
        run: |
          source .venv/bin/activate

          SDK_ROOT="$(west topdir)"

          echo "=== SDK root ==="
          echo "$SDK_ROOT"

          cd "$SDK_ROOT"

          echo "=== Current directory ==="
          pwd

          echo "=== Nuwa tool ==="
          ls -l tools/meta_tools/nuwa.py

          echo "=== Nuwa help ==="
          python tools/meta_tools/nuwa.py --help

      # ------------------------------------------------------------
      # 7. Build hello_world
      # ------------------------------------------------------------
      - name: Build hello_world
        run: |
          source .venv/bin/activate

          SDK_ROOT="$(west topdir)"
          cd "$SDK_ROOT"

          echo "=== Build directory ==="
          pwd

          echo "=== Build ==="
          python tools/meta_tools/nuwa.py build \
            -b rtl872xda_evb \
            zephyr/samples/hello_world
