name: macOS Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      # --------------------------------------------------
      # 1. Install host dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          brew install python@3.13 cmake ninja

          echo "=== Python ==="
          /opt/homebrew/opt/python@3.13/bin/python3.13 --version

          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

      # --------------------------------------------------
      # 2. Create Python virtual environment
      # --------------------------------------------------
      - name: Setup Python environment
        run: |
          /opt/homebrew/opt/python@3.13/bin/python3.13 \
            -m venv "$HOME/nuwa/.venv"

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install --upgrade pip

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install west

          echo "=== Python ==="
          "$HOME/nuwa/.venv/bin/python" --version

          echo "=== Pip ==="
          "$HOME/nuwa/.venv/bin/python" -m pip --version

          echo "=== West ==="
          "$HOME/nuwa/.venv/bin/west" --version

      # --------------------------------------------------
      # 3. Get Nuwa SDK
      # --------------------------------------------------
      - name: Get Nuwa SDK
        run: |
          mkdir -p "$HOME/nuwa"
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/west" \
            init -m https://github.com/Ameba-AIoT/nuwa.git

          "$HOME/nuwa/.venv/bin/west" update

      # --------------------------------------------------
      # 4. Create nuwa.py shortcut
      # --------------------------------------------------
      - name: Create nuwa.py shortcut
        run: |
          cd "$HOME/nuwa"

          ln -sf tools/meta_tools/nuwa.py nuwa.py

          echo "=== Nuwa SDK root ==="
          pwd

          echo "=== Directory ==="
          ls -al

          echo "=== nuwa.py ==="
          ls -l nuwa.py

      # --------------------------------------------------
      # 5. Install Nuwa Python dependencies
      # --------------------------------------------------
      - name: Install Nuwa Python dependencies
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install -r modules/hal/realtek/ameba/scripts/requirements.txt

      # --------------------------------------------------
      # 6. Test Nuwa
      # --------------------------------------------------
      - name: Test Nuwa
        run: |
          cd "$HOME/nuwa"

          echo "=== Python ==="
          "$HOME/nuwa/.venv/bin/python" --version
          "$HOME/nuwa/.venv/bin/python" -c \
            "import sys; print(sys.executable)"

          echo "=== Nuwa ==="
          "$HOME/nuwa/.venv/bin/python" ./nuwa.py --help

      # --------------------------------------------------
      # 7. Build hello_world
      # --------------------------------------------------
      - name: Build hello_world
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" ./nuwa.py build \
            -b rtl872xda_evb \
            zephyr/samples/hello_world
