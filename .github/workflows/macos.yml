name: macOS Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      # --------------------------------------------------
      # 1. Install host dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          brew install python@3.13 cmake ninja mbedtls@3

          echo "=== Python ==="
          /opt/homebrew/opt/python@3.13/bin/python3.13 --version

          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== mbedTLS ==="
          brew --prefix mbedtls@3

      # --------------------------------------------------
      # 2. Setup mbedTLS environment
      # --------------------------------------------------
      - name: Setup mbedTLS
        run: |
          MBEDTLS_PREFIX="$(brew --prefix mbedtls@3)"

          echo "MBEDTLS_PREFIX=$MBEDTLS_PREFIX"

          echo "CPPFLAGS=-I${MBEDTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CFLAGS=-I${MBEDTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${MBEDTLS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MBEDTLS_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "=== Check header ==="
          test -f "${MBEDTLS_PREFIX}/include/mbedtls/platform_util.h"

          echo "Found:"
          ls -l "${MBEDTLS_PREFIX}/include/mbedtls/platform_util.h"

      # --------------------------------------------------
      # 3. Create Python virtual environment
      # --------------------------------------------------
      - name: Setup Python environment
        run: |
          /opt/homebrew/opt/python@3.13/bin/python3.13 \
            -m venv "$HOME/nuwa/.venv"

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install --upgrade pip

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install west

          echo "=== Python ==="
          "$HOME/nuwa/.venv/bin/python" --version

          echo "=== Python executable ==="
          "$HOME/nuwa/.venv/bin/python" -c \
            "import sys; print(sys.executable)"

          echo "=== West ==="
          "$HOME/nuwa/.venv/bin/west" --version

      # --------------------------------------------------
      # 4. Get Nuwa SDK
      # --------------------------------------------------
      - name: Get Nuwa SDK
        run: |
          mkdir -p "$HOME/nuwa"
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/west" \
            init -m https://github.com/Ameba-AIoT/nuwa.git

          "$HOME/nuwa/.venv/bin/west" update

      # --------------------------------------------------
      # 5. Create nuwa.py shortcut
      # --------------------------------------------------
      - name: Create nuwa.py shortcut
        run: |
          cd "$HOME/nuwa"

          ln -sf tools/meta_tools/nuwa.py nuwa.py

          ls -l nuwa.py

      # --------------------------------------------------
      # 6. Install Ameba Python dependencies
      # --------------------------------------------------
      - name: Install Ameba Python dependencies
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" -m pip install -v \
            -r modules/hal/realtek/ameba/scripts/requirements.txt

      # --------------------------------------------------
      # 7. Test Nuwa
      # --------------------------------------------------
      - name: Test Nuwa
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" ./nuwa.py --help

      # --------------------------------------------------
      # 8. Build hello_world
      # --------------------------------------------------
      - name: Build hello_world
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" ./nuwa.py build \
            -b rtl872xda_evb \
            zephyr/samples/hello_world
