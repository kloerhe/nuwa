name: macOS Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      # --------------------------------------------------
      # 1. Install host dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          brew install python cmake ninja

      # --------------------------------------------------
      # 2. Create Python virtual environment
      # --------------------------------------------------
      - name: Setup Python environment
        run: |
          python3 -m venv "$HOME/nuwa/.venv"
          source "$HOME/nuwa/.venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install west

          echo "Python:"
          python --version

          echo "West:"
          west --version

      # --------------------------------------------------
      # 3. Get Nuwa SDK
      # --------------------------------------------------
      - name: Get Nuwa SDK
        run: |
          source "$HOME/nuwa/.venv/bin/activate"

          mkdir -p "$HOME/nuwa"
          cd "$HOME/nuwa"

          west init -m https://github.com/Ameba-AIoT/nuwa.git
          west update

      # --------------------------------------------------
      # 4. Create nuwa.py shortcut
      # --------------------------------------------------
      - name: Create nuwa.py shortcut
        run: |
          cd "$HOME/nuwa"

          ln -sf tools/meta_tools/nuwa.py nuwa.py

          echo "=== Nuwa SDK root ==="
          pwd

          echo "=== Directory ==="
          ls -al

          echo "=== nuwa.py ==="
          ls -l nuwa.py

      # --------------------------------------------------
      # 5. Test Nuwa
      # --------------------------------------------------
      - name: Test Nuwa
        run: |
          source "$HOME/nuwa/.venv/bin/activate"

          cd "$HOME/nuwa"

          echo "=== Python ==="
          which python
          python --version

          echo "=== Nuwa ==="
          ./nuwa.py --help

      # --------------------------------------------------
      # 6. Build hello_world
      # --------------------------------------------------
      - name: Build hello_world
        run: |
          source "$HOME/nuwa/.venv/bin/activate"

          cd "$HOME/nuwa"

          ./nuwa.py build \
            -b rtl872xda_evb \
            zephyr/samples/hello_world
