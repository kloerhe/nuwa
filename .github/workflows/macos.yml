name: macOS Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      # --------------------------------------------------
      # 1. Install host dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          brew install python@3.13 cmake ninja

          echo "=== Python ==="
          /opt/homebrew/opt/python@3.13/bin/python3.13 --version

          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

      # --------------------------------------------------
      # 2. Build Mbed TLS 2.28
      #
      # python-mbedtls expects the Mbed TLS 2.x API.
      # Do NOT use Homebrew mbedtls@3 here.
      # --------------------------------------------------
      - name: Build Mbed TLS 2.28
        run: |
          cd "$RUNNER_TEMP"

          curl -L \
            -o mbedtls-2.28.10.tar.gz \
            https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v2.28.10.tar.gz

          tar xf mbedtls-2.28.10.tar.gz

          cd mbedtls-2.28.10

          mkdir build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mbedtls" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

          cmake --build . --parallel
          cmake --install .

          echo "=== Installed Mbed TLS ==="
          find "$RUNNER_TEMP/mbedtls" -maxdepth 3 -type f | sort

      # --------------------------------------------------
      # 3. Setup Mbed TLS environment
      # --------------------------------------------------
      - name: Setup Mbed TLS environment
        run: |
          MBEDTLS_PREFIX="$RUNNER_TEMP/mbedtls"

          echo "MBEDTLS_PREFIX=$MBEDTLS_PREFIX"

          echo "CPPFLAGS=-I${MBEDTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CFLAGS=-I${MBEDTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${MBEDTLS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${MBEDTLS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${MBEDTLS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MBEDTLS_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "=== Check Mbed TLS header ==="
          test -f \
            "${MBEDTLS_PREFIX}/include/mbedtls/platform_util.h"

          ls -l \
            "${MBEDTLS_PREFIX}/include/mbedtls/platform_util.h"

          echo "=== Mbed TLS version ==="
          grep -E \
            'MBEDTLS_VERSION_(MAJOR|MINOR|PATCH)' \
            "${MBEDTLS_PREFIX}/include/mbedtls/version.h"

      # --------------------------------------------------
      # 4. Create Python virtual environment
      # --------------------------------------------------
      - name: Setup Python environment
        run: |
          /opt/homebrew/opt/python@3.13/bin/python3.13 \
            -m venv "$HOME/nuwa/.venv"

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install --upgrade pip

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install west

          echo "=== Python ==="
          "$HOME/nuwa/.venv/bin/python" --version

          echo "=== Python executable ==="
          "$HOME/nuwa/.venv/bin/python" \
            -c "import sys; print(sys.executable)"

          echo "=== Pip ==="
          "$HOME/nuwa/.venv/bin/python" \
            -m pip --version

          echo "=== West ==="
          "$HOME/nuwa/.venv/bin/west" --version

      # --------------------------------------------------
      # 5. Get Nuwa SDK
      # --------------------------------------------------
      - name: Get Nuwa SDK
        run: |
          mkdir -p "$HOME/nuwa"
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/west" \
            init \
            -m https://github.com/Ameba-AIoT/nuwa.git

          "$HOME/nuwa/.venv/bin/west" update

      # --------------------------------------------------
      # 6. Create nuwa.py shortcut
      # --------------------------------------------------
      - name: Create nuwa.py shortcut
        run: |
          cd "$HOME/nuwa"

          ln -sf tools/meta_tools/nuwa.py nuwa.py

          echo "=== Nuwa SDK root ==="
          pwd

          echo "=== Directory ==="
          ls -al

          echo "=== nuwa.py ==="
          ls -l nuwa.py

      # --------------------------------------------------
      # 7. Inspect Ameba requirements
      # --------------------------------------------------
      - name: Inspect Ameba requirements
        run: |
          cd "$HOME/nuwa"

          echo "=== requirements.txt ==="
          cat modules/hal/realtek/ameba/scripts/requirements.txt

          echo "=== mbedtls dependency ==="
          grep -ni mbedtls \
            modules/hal/realtek/ameba/scripts/requirements.txt || true

      # --------------------------------------------------
      # 8. Install Ameba Python dependencies
      # --------------------------------------------------
      - name: Install Ameba Python dependencies
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" \
            -m pip install -v \
            -r modules/hal/realtek/ameba/scripts/requirements.txt

      # --------------------------------------------------
      # 9. Verify python-mbedtls
      # --------------------------------------------------
      - name: Verify python-mbedtls
        run: |
          echo "=== python-mbedtls import ==="

          "$HOME/nuwa/.venv/bin/python" \
            -c "import mbedtls; print(mbedtls.__file__)"

          "$HOME/nuwa/.venv/bin/python" \
            -c "import mbedtls; print('python-mbedtls import: OK')"

      # --------------------------------------------------
      # 10. Test Nuwa
      # --------------------------------------------------
      - name: Test Nuwa
        run: |
          cd "$HOME/nuwa"

          echo "=== Python ==="
          "$HOME/nuwa/.venv/bin/python" --version

          echo "=== Nuwa ==="
          "$HOME/nuwa/.venv/bin/python" \
            ./nuwa.py --help

      # --------------------------------------------------
      # 11. Build hello_world
      # --------------------------------------------------
      - name: Build hello_world
        run: |
          cd "$HOME/nuwa"

          "$HOME/nuwa/.venv/bin/python" \
            ./nuwa.py build \
            -b rtl872xda_evb \
            zephyr/samples/hello_world
